<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Passagem Aérea</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <h1>Cadastro de Passagem Aérea</h1>

    <form action="#" method="post">

      <div class="campo">
        <label for="codigo">Código da Passagem:</label>
        <input type="text" id="codigo" name="codigo" placeholder="Ex: AV-20458" required>
      </div>

      <div class="campo">
        <label for="nome">Nome da Passagem:</label>
        <input type="text" id="nome" name="nome" placeholder="Ex: Brasília → São Paulo (Voo 1234)" required>
      </div>

      <div class="campo">
        <label for="descricao">Descrição:</label>
        <textarea id="descricao" name="descricao" rows="4" placeholder="Detalhes sobre a passagem: horário, escalas, bagagem..." required></textarea>
      </div>

      <div class="campo">
        <label for="data">Data de Cadastro:</label>
        <input type="date" id="data" name="data" required>
      </div>

      <div class="linha">
        <div class="campo">
          <label for="preco">Preço (R$):</label>
          <input type="text" id="preco" name="preco" placeholder="0,00" inputmode="decimal" pattern="[0-9]+([,\.][0-9]{1,2})?" title="Digite um valor numérico. Ex: 450,90" required>
        </div>

        <div class="campo">
          <label for="estoque">Assentos Disponíveis:</label>
          <input type="text" id="estoque" name="estoque" placeholder="0" min="0" inputmode="numeric" pattern="[0-9]+" title="Digite um número inteiro maior ou igual a 0" required>
        </div>
      </div>

      <div class="campo">
        <label for="categoria">Categoria da Passagem:</label>
        <select id="categoria" name="categoria" required>
          <option value="">Selecione uma categoria</option>
          <option value="economica">Econômica</option>
          <option value="premium">Premium Economy</option>
          <option value="executiva">Executiva</option>
          <option value="primeira">Primeira Classe</option>
          <option value="promocional">Promocional</option>
        </select>
      </div>

      <div class="botoes">
        <button type="submit" class="btn-cadastrar">Cadastrar Passagem</button>
        <button type="reset" class="btn-limpar">Limpar Campos</button>
      </div>

    </form>
  </main>

</body>
</html>
